name: Deploy production GAS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-gas-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Push main to production GAS
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up clasp credentials
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON_PROD: ${{ secrets.CLASP_JSON_PROD }}
        run: |
          test -n "$CLASPRC_JSON"
          test -n "$CLASP_JSON_PROD"

          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '%s' "$CLASP_JSON_PROD" > ".clasp.json"

          chmod 600 "$HOME/.clasprc.json"
          chmod 600 ".clasp.json"

      - name: Show files to be pushed
        run: npx clasp show-file-status

      - name: Push to production GAS
        run: npx clasp push --force

